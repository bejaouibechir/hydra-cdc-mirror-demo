# PostgreSQL 16 with logical replication, created and filled at the first start.
services:
  postgres:
    image: postgres:16
    container_name: hydra-cdc-pg
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-hydra}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - ./db/initdb.sql:/docker-entrypoint-initdb.d/01-initdb.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
